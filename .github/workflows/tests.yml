name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Every push: smoke. PR: full. Default-branch push/manual: both.
      # Each matrix job owns a separate runner, app, port and database.
      matrix:
        suite: ${{ fromJSON(github.event_name == 'pull_request' && '["full"]' || (github.event_name == 'workflow_dispatch' || github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch) && '["smoke","full"]' || '["smoke"]') }}
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/${{ matrix.suite }}/html
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/${{ matrix.suite }}/playwright.json
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install declared pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record runtime versions
        run: |
          node --version
          pnpm --version
          pnpm exec playwright --version
      - name: Install official browsers and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run five-path desktop smoke
        if: matrix.suite == 'smoke'
        run: pnpm test:smoke --reporter=list,html,json --output=test-results/smoke/artifacts
      - name: Run full required regression
        if: matrix.suite == 'full'
        run: pnpm test --workers=1 --retries=0 --forbid-only --reporter=list,html,json --output=test-results/full/artifacts
      - name: Preserve native reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: playwright-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/${{ matrix.suite }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
